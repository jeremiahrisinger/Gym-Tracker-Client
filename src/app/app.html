<div class="app-header box-shadow-dark">
    <h1>Workout Tracker</h1>
    @if (loginService.menuAccess$ | async; as menus) {        
        <div class="nav-bar">
            <button 
                class="btn-clear" 
                [routerLink]="['/workouts']" >
                Workouts
            </button>
            <button 
                class="btn-clear" 
                [routerLink]="['/programs']" >
                Programs
            </button>
            <button 
                class="btn-clear" 
                [routerLink]="['/chart']" >
                Chart
            </button>
            <button 
                class="btn-clear" 
                [routerLink]="['/account']" >
                Account
            </button>
        </div>
        <div >
            <button 
                class="btn-clear" 
                [routerLink]="['/login']"
                (click)="onLogout()" >
                <mat-icon>logout</mat-icon>
            </button>
        </div>
    } @else {
        <div >
            <button 
                class="btn-clear" 
                [routerLink]="['/login']"
                (click)="onLogout()" >
                Log In
            </button>
        </div>
    }
</div>
<div class="app-content">
    <router-outlet></router-outlet>
</div>
