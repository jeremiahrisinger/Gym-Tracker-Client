<div class="main-container">
  <app-page-title [title]="'Create New Program'"></app-page-title>
  <app-error [errorMessages]="errors"></app-error>


  <app-section-header header="Start New Program"></app-section-header>
  <form
    (ngSubmit)="createNewProgram()"
    #setForm="ngForm"
    class="inline-form"
  >
    <app-input
      label="Program Name"
      name="programName"
      type="text"
      size="large"
      [required]="true"
      [(value)]="newProgram.name"
      helpText="The name of the new program."
        placeholder="e.g., Amazing Workout Program!"
    ></app-input>

    <div class="btn-row-rev">
      <button
        type="submit"
        [disabled]="!setForm.valid"
        class="btn-submit"
      >
        Add Day
      </button>
    </div>
  </form>

  <app-page-title [title]="'Existing Program'"></app-page-title>

  @for (p of programs; track $index) {

  <app-table
    [name]="p.name"
    [columns]="tableColumns"
    [data]="p.days"
    [emptyMessage]="'No days in this program yet!'"
    [includeCustomButton]="true"
    [customButtonLabel]="'Start Workout'"
    [customButtonIcon]="'start'"
    (rowItem)="startWorkout(p._id!, $event)"
  ></app-table>
  <div class="btn-row-rev">
    <button
      class="btn-modify"
      [routerLink]="['/edit-program', p._id]"
    >
      Edit Program
    </button>
  </div>
  <br />
  } @empty {
  <p style="min-width: 100%; text-align: center;">No Programs recorded. Get Lifting!</p>
  }
</div>
