<div class="main-container">
  <app-page-title [title]="'Edit ' + program.name"></app-page-title>
  <app-error [errorMessages]="errors"></app-error>

  <form
    (ngSubmit)="addDay()"
    #setForm="ngForm"
    class="form"
  >
    <div class="form-group large">
      <label for="name">Exercise Name</label>
      <input
        type="text"
        id="name"
        name="name"
        [(ngModel)]="newDay.name"
        required
        placeholder="e.g., Chest Day, Push Day 2, Squat Day"
        min="0"
      />
    </div>
    <div class="btn-row-rev">
      <button
        type="submit"
        [disabled]="!setForm.valid"
        class="btn-submit"
      >
        Add Day
      </button>
    </div>

  </form>
  <app-table
    [name]="program.name"
    [columns]="tableColumns"
    [data]="program.days"
    [emptyMessage]="'No days in this program yet.'"
    [includeDeleteButton]="true"
    [includeEditButton]="true"
    (deleteRow)="deleteDayFromProgram(program, $event)"
    (editRow)="editDayInProgram($event)"
  >
  </app-table>

  <div class="btn-row">
    <button
      type="button"
      class="btn-modify"
      [routerLink]="['/programs']"
    >
      Back
    </button>
  </div>
</div>
