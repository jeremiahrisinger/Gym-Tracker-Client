<div class="main-container">
  <app-page-title [title]="'Edit ' + program.name"></app-page-title>
  <app-error [errorMessages]="errors"></app-error>

  <app-section-header header="Add Program Day"></app-section-header>
  <form
    (ngSubmit)="addDay()"
    #setForm="ngForm"
    class="inline-form"
  >
    <app-input
      label="Program Day Name"
      name="name"
      type="text"
      size="large"
      [required]="true"
      [(value)]="newDay.name"
      helpText="The name of the day to be added to the program."
      placeholder="e.g., Chest Day, Push Day 2, Squat Day"
    ></app-input>

    <div class="btn-row-rev">
      <button
        type="submit"
        [disabled]="!setForm.valid"
        class="btn-submit"
      >
        Add Day
      </button>
    </div>
  </form>
  
  <app-table
    [name]="program.name"
    [columns]="tableColumns"
    [data]="program.days"
    [emptyMessage]="'No days in this program yet.'"
    [includeDeleteButton]="true"
    [includeEditButton]="true"
    (deleteRow)="deleteDayFromProgram(program, $event)"
    (editRow)="editDayInProgram($event)"
  >
  </app-table>

  <div class="btn-row">
    <button
      type="button"
      class="btn-modify"
      [routerLink]="['/programs']"
    >
      Back
    </button>
  </div>
</div>
