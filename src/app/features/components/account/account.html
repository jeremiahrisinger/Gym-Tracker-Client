<div class="main-container">
  <h2>Account</h2>
  <hr />
  <br />

  <app-error [errorMessages]="errors"></app-error>

  <form
    (ngSubmit)="updateUser()"
    #userForm="ngForm"
    class="form"
  >
    <div class="input-row">
      <app-input
        label="Name"
        name="name"
        type="text"
        size="large"
        [required]="true"
        [(value)]="user.name"
        placeholder="e.g. John Cena"
      ></app-input>

      <app-input
        label="Email"
        name="email"
        type="email"
        size="large"
        [required]="true"
        [(value)]="user.email"
        placeholder="Enter your email"
      ></app-input>

      <app-input
        label="Username"
        name="username"
        type="text"
        size="large"
        [required]="true"
        [(value)]="user.username"
        placeholder="Enter your username"
      ></app-input>
    </div>

    <div class="input-row">
      <app-input
        label="Password"
        name="password"
        type="password"
        size="large"
        [required]="true"
        [(value)]="user.password"
        placeholder="Enter your password"
      ></app-input>

      <app-input
        label="Confirm Password"
        name="password"
        type="password"
        size="large"
        [required]="true"
        [(value)]="confirmPassword"
        placeholder="Enter your password"
      ></app-input>
    </div>

    <div class="btn-row-rev">
      <button
        type="submit"
        [disabled]="!userForm.valid"
        class="btn-submit"
      >
        Save
      </button>

      <button
        type="button"
        class="btn-red"
        title="Delete Account"
        (click)="deleteAccount()"
      >
        Delete Account
      </button>
    </div>

  </form>
</div>
