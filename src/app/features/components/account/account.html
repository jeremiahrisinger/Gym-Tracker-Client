<div class="main-container">
  <h2>Account</h2>
  <hr />
  <br />

  <app-error [errorMessages]="errors"></app-error>

  <form
    (ngSubmit)="updateUser()"
    #userForm="ngForm"
    class="form"
  >

    <div class="form-group">
      <label for="name">Name</label>
      <input
        type="text"
        id="name"
        name="name"
        [(ngModel)]="user.name"
        required
        placeholder="e.g. John Cena"
      />
    </div>

    <div class="form-group">
      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        name="username"
        [(ngModel)]="user.username"
        required
        placeholder="Enter your username"
      />
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="user.email"
        required
        placeholder="Enter your email"
      />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="user.password"
        required
        placeholder="Enter your password"
      />
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input
        type="password"
        id="confirmPassword"
        name="confirmPassword"
        [(ngModel)]="confirmPassword"
        required
        placeholder="Confirm your password"
      />
    </div>

    <div class="btn-row-rev">
      <button
        type="submit"
        [disabled]="!userForm.valid"
        class="btn-submit"
      >
        Save
      </button>

      <button
        type="button"
        class="btn-red"
        title="Delete Account"
        (click)="deleteAccount()"
      >
        Delete Account
      </button>
    </div>

  </form>
</div>
