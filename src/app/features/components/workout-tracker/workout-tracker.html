<div class="main-container">
    <app-page-title [title]="'Workout Tracker'"></app-page-title>
    <app-error [errorMessages]="errors"></app-error>

    <app-common-table
        [name]="workout?.name"
        [columns]="tableColumns"
        [data]="workout?.sets"
        [emptyMessage]="'No workout sets recorded yet.'"
        [includeDeleteButton]="true"
        (deleteRow)="deleteSet($event)"
    >
    </app-common-table>
    <br/>
    
    <app-page-title [title]="'Add New Set'"></app-page-title>

    <!-- 📋 INPUT FORM SECTION -->
    <form
        (ngSubmit)="addSet()"
        #setForm="ngForm"
        class="form"
    >
        <div class="form-group small">
            <label for="exercise">Exercise Name</label>
            <input
                type="text"
                id="exercise"
                name="exercise"
                [(ngModel)]="newSet.exercise"
                required
                placeholder="e.g., Bench Press"
            />
        </div>

        <div class="form-group small">
            <label for="sets">Sets</label>
            <input
                type="number"
                id="sets"
                name="sets"
                [(ngModel)]="newSet.sets"
                required
                min="0"
            />
        </div>

        <div class="form-group small">
            <label for="reps">Reps</label>
            <input
                type="number"
                id="reps"
                name="reps"
                [(ngModel)]="newSet.reps"
                required
                min="0"
            />
        </div>

        <div class="form-group small">
            <label for="weight">Weight (lbs)</label>
            <input
                type="number"
                id="weight"
                name="weight"
                [(ngModel)]="newSet.weight"
                required
                min="0"
            />
        </div>

        <div class="form-group small">
            <label for="rateOfPerceivedExertion">RPE</label>
            <input
                type="number"
                id="rateOfPerceivedExertion"
                name="rateOfPerceivedExertion"
                [(ngModel)]="newSet.rateOfPerceivedExertion"
                required
                min="1"
            />
        </div>

        <div class="form-group large">
            <label for="notes">Notes</label>
            <input
                type="text"
                id="notes"
                name="notes"
                [(ngModel)]="newSet.notes"
            />
        </div>

        <div class="btn-row">
            <button
                type="submit"
                [disabled]="!setForm.valid"
                class="btn-submit"
            >
                Add Set
            </button>
            <button
                type="button"
                class="btn-modify"
            >
                Clear
            </button>
            <button
                class="btn-modify"
                [routerLink]="['/workouts']"
            >
                All Workouts
            </button>
            @if(this.workout?.sets == null || this.workout.sets?.length==0){
            <button
                type="button"
                class="btn-red"
                title="Delete Workout"
                (click)="this.deleteWorkout()"
            >
                Delete Workout
            </button>
            }
        </div>

    </form>

</div>
