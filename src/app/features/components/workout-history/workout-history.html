<div class="main-container">
    <app-page-title [title]="'Start New Workout'"></app-page-title>
    <app-error [errorMessages]="errors"></app-error>

    <form
        (ngSubmit)="createNewWorkout()"
        #setForm="ngForm"
        class="form"
    >
        <div class="form-group small">
            <label for="workoutName">Workout Name</label>
            <input
                type="text"
                id="workoutName"
                name="workoutName"
                [(ngModel)]="newWorkout.name"
                required
                placeholder="e.g., Week 2: Push Day "
            />
        </div>

        <div class="btn-row">
            <button
                type="submit"
                [disabled]="!setForm.valid"
                class="btn-submit"
            >
                Start New Workout
            </button>
        </div>
    </form>

    <br />

    <app-page-title [title]="'Workout History'"></app-page-title>

    @for (w of workouts; track $index) {
    <app-common-table
        [name] = "w.name"
        [columns]="tableColumns"
        [data]="w.sets"
        [emptyMessage]="'No sets recorded'"
    ></app-common-table>
    <div class="btn-row">
        <button
            class="btn-modify"
            [routerLink]="['/tracker', w._id]"
        >
            Edit Workout
        </button>
    </div>
    <br />
    } @empty {
    <p style="min-width: 100%; text-align: center;">No Workouts recorded. Get Lifting!</p>
    }


</div>
