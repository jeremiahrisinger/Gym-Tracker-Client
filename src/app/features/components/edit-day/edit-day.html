<div class="main-container">
  <app-page-title [title]="'Edit ' + programDay.name"></app-page-title>
  <app-error [errorMessages]="errors"></app-error>

  <app-section-header header="Add Exercise"></app-section-header>
  <form
    (ngSubmit)="addExercise()"
    #setForm="ngForm"
    class="inline-form"
  >
    <app-input
      label="Exercise Name"
      name="name"
      type="text"
      size="large"
      [required]="true"
      [(value)]="newExercise.name"
      helpText="The name of the exercise to be added to the program."
      placeholder="e.g., Bench Press, Squat, Deadlift Rack Pulls"
    ></app-input>

    <div class="btn-row-rev">
      <button
        type="submit"
        [disabled]="!setForm.valid"
        class="btn-submit"
      >
        Add Exercise
      </button>
    </div>
  </form>

  <br />
  @if(programDay.exercises.length > 0){
  <app-section-header [header]="'Exercises'"></app-section-header>
  <app-tabs
    [tabs]="tabItems()"
    [activeId]="getActiveExercise()._id || programDay.exercises[0]._id"
    (tabChange)="activeTab.set($event)"
  >
    @if (getActiveExercise(); as current) {
    <app-table
      [name]="current.name"
      [columns]="tableColumns"
      [data]="current.sets"
      [emptyMessage]="'No exercise sets recorded yet.'"
      [includeDeleteButton]="!editMode"
      [includeEditButton]="!editMode"
      [includeCustomButton]="true"
      [customButtonLabel]="'Copy'"
      [customButtonIcon]="'content_copy'"
      [customButtonHelp]="'Copy this row as a new set in the program'"
      (rowItem)="addSetToExercise(current, $event.target)"
      (deleteRow)="deleteSetFromExercise(current,$event)"
      (editRow)="editSetInExercise($event)"
    >
    </app-table>

    <br />

    @if(editMode){
    <app-section-header [header]="'Edit Set ' + this.newSet.setNumber"></app-section-header>

    } @else {
    <app-section-header [header]="'Add New Set'"></app-section-header>
    }
    <!-- 📋 INPUT FORM SECTION -->
    <form
      (ngSubmit)="addSetToExercise(current, newMetric)"
      #setForm="ngForm"
      class="form"
    >
      <div class="input-row">
        <app-input
          label="Reps"
          name="reps"
          type="number"
          [required]="true"
          [(value)]="newMetric.reps"
          helpText="The number of whole reps completed in this set."
        ></app-input>

        <app-input
          label="Weight (lbs)"
          name="weight"
          type="number"
          [required]="true"
          [(value)]="newMetric.weight"
          helpText="The amount in pounds lifted in each rep of this set."
        ></app-input>

        <app-input
          size="small"
          label="RPE"
          name="rpe"
          type="number"
          [(value)]="newMetric.rpe"
          helpText="Rate of Perceived Exertion (Rating of Perceived Effort) is a subjective scale used to measure how hard your body works during physical activity, exercise, or training."
        ></app-input>
      </div>
      <div class="input-row">

        <app-input
          size="small"
          label="Pause Top"
          name="pauseTop"
          type="number"
          [(value)]="newMetric.pauseTop"
          helpText="Pause Top is the number of seconds you staticly hold the exercise at the top of the rep."
        ></app-input>

        <app-input
          size="small"
          label="Pause Middle"
          name="pauseMiddle"
          type="number"
          [(value)]="newMetric.pauseMiddle"
          helpText="Pause Middle is the number of seconds you staticly hold the exercise in the middle of the rep."
        ></app-input>

        <app-input
          size="small"
          label="Pause Bottom"
          name="pauseBottom"
          type="number"
          [(value)]="newMetric.pauseBottom"
          helpText="Pause Bottom is the number of seconds you staticly hold the exercise at the bottom of the rep."
        ></app-input>
      </div>
      <div class="input-row">
        <app-input
          size="small"
          label="Ecentric Tempo"
          name="ecentricTempo"
          type="number"
          [(value)]="newMetric.ecentricTempo"
          helpText="Eccentric Tempo is the number of seconds spent lowering or resisting a weight as a muscle lengthens."
        ></app-input>

        <app-input
          size="small"
          label="Concentric Tempo"
          name="concentricTempo"
          type="number"
          size="small"
          [(value)]="newMetric.concentricTempo"
          helpText="Concentric Tempo is the number of seconds spent lifting or pushing a weight as a muscle shortens."
        ></app-input>
      </div>
      <div class="btn-row-rev">
        @if(!editMode){
        <button
          type="submit"
          [disabled]="!setForm.valid"
          class="btn-submit"
        >
          Add Set
        </button>
        }
        @else {
        <button
          type="button"
          [disabled]="!setForm.valid"
          class="btn-submit"
          (click)="updateSetInExercise(current, newMetric)"
        >
          Done
        </button>
        }
      </div>

    </form>

    <div class="btn-row-rev">
      <button
        type="button"
        (click)="deleteExercise(current)"
        class="btn-red"
      >
        Delete Exercise
      </button>
    </div>
    }
  </app-tabs>
  <div class="btn-row">
    <button
      type="button"
      class="btn-modify"
      [routerLink]="['/edit-program', programId()]"
    >
      Back
    </button>
  </div>
  }
</div>
