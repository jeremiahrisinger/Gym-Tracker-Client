<div class="main-container-narrow">
    <h2>Sign Up</h2>
    <hr class="divider" />
    <br />
    <app-error [errorMessages]="errors"></app-error>
    
    <form
        (ngSubmit)="onSignUp()"
        #signUpForm="ngForm"
        class="form"
    >
        <div class="form-group">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                [(ngModel)]="newUser.username"
                required
                placeholder="Enter your username"
            />
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                [(ngModel)]="newUser.email"
                required
                placeholder="Enter your email"
            />
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                [(ngModel)]="newUser.password"
                required
                placeholder="Enter your password"
            />
        </div>

        <div class="form-group">
            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                name="name"
                [(ngModel)]="newUser.name"
                required
                placeholder="e.g. John Cena"
            />
        </div>

        <div class="btn-row">
            <button
                type="submit"
                [disabled]="!signUpForm.valid"
                class="btn-submit"
            >
                Sign Up
            </button>

            <button
                type="button"
                class="btn-modify"
                [routerLink]="['/login']"
            >
                Log In
            </button>
        </div>
    </form>
</div>
