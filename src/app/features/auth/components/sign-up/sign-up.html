<div class="main-container-narrow">
  <h2>Sign Up</h2>
  <hr class="divider" />
  <br />
  <app-error [errorMessages]="errors"></app-error>

  <form
    (ngSubmit)="onSignUp()"
    #signUpForm="ngForm"
    class="form"
  >
    <app-input
      label="Username"
      name="username"
      type="text"
      size="large"
      [required]="true"
      [(value)]="newUser.username"
      placeholder="Enter your username"
    ></app-input>

    <app-input
      label="Email"
      name="email"
      type="email"
      size="large"
      [required]="true"
      [(value)]="newUser.email"
      placeholder="Enter your email"
    ></app-input>

    <app-input
      label="Password"
      name="password"
      type="password"
      size="large"
      [required]="true"
      [(value)]="newUser.password"
      placeholder="Enter your password"
    ></app-input>

    <app-input
      label="Name"
      name="name"
      type="text"
      size="large"
      [required]="true"
      [(value)]="newUser.name"
      placeholder="e.g. John Cena"
    ></app-input>

    <div class="btn-row-rev">
      <button
        type="submit"
        [disabled]="!signUpForm.valid"
        class="btn-submit"
      >
        Sign Up
      </button>

      <button
        type="button"
        class="btn-modify"
        [routerLink]="['/login']"
      >
        Log In
      </button>
    </div>
  </form>
</div>
